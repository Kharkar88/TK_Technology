{% extends 'admin_base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3>Contact Details</h3>

    </div>

    <div class="card-body">

        <table class="table table-bordered">

            <tr>
                <th>Name</th>
                <td>{{ contact.name }}</td>
            </tr>

            <tr>
                <th>Email</th>
                <td>{{ contact.email }}</td>
            </tr>

            <tr>
                <th>Phone</th>
                <td>{{ contact.phone }}</td>
            </tr>

            <tr>
                <th>Subject</th>
                <td>{{ contact.subject }}</td>
            </tr>

            <tr>
                <th>Message</th>
                <td>{{ contact.message }}</td>
            </tr>

        </table>

        <a href="{% url 'contact_management' %}"
           class="btn btn-secondary">

            Back

        </a>

    </div>

</div>

{% endblock %}
