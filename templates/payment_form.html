{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Add Payment</h3>

        </div>

        <div class="card-body">

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-success">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-success">

                    Save Payment

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
