{% extends 'admin_base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3>Edit Trainer</h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ trainer.name }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ trainer.email }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ trainer.phone }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Subject</label>

                <input
                    type="text"
                    name="subject"
                    class="form-control"
                    value="{{ trainer.subject }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Experience</label>

                <input
                    type="number"
                    name="experience"
                    class="form-control"
                    value="{{ trainer.experience }}"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Update Trainer

            </button>

            <a href="{% url 'trainer_management' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
