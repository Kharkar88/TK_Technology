<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TK Technology Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#eef2f7;
        }

        .sidebar{
            position:fixed;
            left:0;
            top:0;
            width:260px;
            height:100vh;
            background:linear-gradient(180deg,#0f172a,#1e293b);
            overflow-y:auto;
            box-shadow:0 0 20px rgba(0,0,0,.2);
        }

        .logo{
            text-align:center;
            color:white;
            padding:25px 15px;
            border-bottom:1px solid rgba(255,255,255,.1);
        }

        .logo h3{
            font-size:28px;
            font-weight:700;
            margin:0;
        }

        .logo p{
            color:#cbd5e1;
            margin-top:5px;
            font-size:13px;
        }

        .menu{
            padding:15px;
        }

        .menu a{
            display:flex;
            align-items:center;
            gap:12px;
            text-decoration:none;
            color:#e2e8f0;
            padding:14px 16px;
            border-radius:10px;
            margin-bottom:8px;
            transition:.3s;
            font-weight:500;
        }

        .menu a:hover{
            background:#2563eb;
            color:white;
            transform:translateX(5px);
        }

        .content{
            margin-left:260px;
            padding:30px;
        }

        .card{
            border:none;
            border-radius:18px;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-4px);
            box-shadow:0 12px 25px rgba(0,0,0,.15);
        }

        .table{
            border-radius:12px;
            overflow:hidden;
        }

        .btn{
            border-radius:10px;
        }

        .alert{
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <h3>🚀 TK Technology</h3>

        <p>Admin Panel</p>

    </div>

    <div class="menu">

        <a href="{% url 'admin_dashboard' %}">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a href="{% url 'student_management' %}">
            <i class="bi bi-people-fill"></i>
            Students
        </a>

        <a href="{% url 'course_management' %}">
            <i class="bi bi-book-fill"></i>
            Courses
        </a>

        <a href="{% url 'trainer_management' %}">
            <i class="bi bi-person-workspace"></i>
            Trainers
        </a>

        <a href="{% url 'payment_management' %}">
            <i class="bi bi-credit-card-2-front-fill"></i>
            Payments
        </a>

        <a href="{% url 'certificate_management' %}">
            <i class="bi bi-award-fill"></i>
            Certificates
        </a>

        <a href="{% url 'result_management' %}">
            <i class="bi bi-bar-chart-fill"></i>
            Results
        </a>

        <a href="{% url 'placement_management' %}">
            <i class="bi bi-briefcase-fill"></i>
            Placements
        </a>

        <a href="{% url 'attendance_management' %}">
            <i class="bi bi-calendar-check-fill"></i>
            Attendance
        </a>

        <a href="{% url 'contact_management' %}">
            <i class="bi bi-envelope-fill"></i>
            Contact
        </a>

        <hr class="text-secondary">

        <a href="/">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>

</div>

<div class="content">

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-success alert-dismissible fade show">

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
                </button>

            </div>

        {% endfor %}

    {% endif %}

    {% block content %}

    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
