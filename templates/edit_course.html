{% extends 'admin_base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3>Edit Course</h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label>Course Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ course.name }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    value="{{ course.category }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Duration</label>

                <input
                    type="text"
                    name="duration"
                    class="form-control"
                    value="{{ course.duration }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Fees</label>

                <input
                    type="number"
                    step="0.01"
                    name="fees"
                    class="form-control"
                    value="{{ course.fees }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Description</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4">{{ course.description }}</textarea>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Update Course

            </button>

            <a href="{% url 'course_management' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
