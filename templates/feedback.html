{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white text-center">

                    <h2>⭐ Student Feedback</h2>

                </div>

                <div class="card-body">

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-success">

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Rating

                            </label>

                            {{ form.rating }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Your Feedback

                            </label>

                            {{ form.message }}

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg">

                            Submit Feedback

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
