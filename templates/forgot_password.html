{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-danger text-white text-center py-4">

<h2 class="fw-bold">

🔑 Forgot Password

</h2>

<p class="mb-0">

Reset Your Password

</p>

</div>

<div class="card-body p-5">

<form method="POST">

{% csrf_token %}

<div class="mb-4">

<label class="form-label fw-bold">

Email Address

</label>

<input
type="email"
name="email"
class="form-control form-control-lg"
placeholder="Enter your registered email"
required>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

New Password

</label>

<input
type="password"
name="new_password"
class="form-control form-control-lg"
placeholder="Enter new password"
required>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

Confirm Password

</label>

<input
type="password"
name="confirm_password"
class="form-control form-control-lg"
placeholder="Confirm new password"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-danger btn-lg rounded-pill">

🔄 Reset Password

</button>

</div>

<div class="text-center mt-4">

<a href="/students/login/">

← Back to Login

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
