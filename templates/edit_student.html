{% extends 'admin_base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Edit Student</h3>

        </div>

        <div class="card-body">

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-success">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">

                        Student Name

                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ student.name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ student.email }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Course

                    </label>

                    <select
                        name="course"
                        class="form-control">

                        {% for course in courses %}

                            <option
                                value="{{ course.id }}"
                                {% if course.id == student.course.id %}
                                    selected
                                {% endif %}>

                                {{ course.name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Update Student

                </button>

                <a href="{% url 'student_management' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
