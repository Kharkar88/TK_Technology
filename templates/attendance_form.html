{% extends 'admin_base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3>📝 Add / Edit Attendance</h3>

        </div>

        <div class="card-body">

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-success">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">

                        Student

                    </label>

                    {{ form.student }}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Date

                    </label>

                    {{ form.date }}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    {{ form.status }}

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Save Attendance

                </button>

                <a href="{% url 'attendance_management' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
